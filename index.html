<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL DESK — OKX Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090F;
    --bg-2:#0B0E16;
    --panel:#0E121C;
    --panel-2:#141926;
    --border:#212739;
    --border-soft:#1A1F2E;
    --amber:#E8B94D;
    --amber-2:#F2CD73;
    --amber-dim:#8A6F33;
    --gain:#3FDB8F;
    --loss:#EF5F66;
    --text:#EDEEF2;
    --text-dim:#8D93A6;
    --text-faint:#525A70;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Space Grotesk", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --glow: 0 0 18px rgba(232,185,77,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--sans); height:100%; overflow-x:hidden;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,185,77,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(63,219,143,0.05), transparent 55%),
      var(--bg);
  }
  ::selection{background:var(--amber-dim); color:#000;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 30px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(20,25,38,0.6), rgba(11,14,22,0.4));
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand h1{
    font-family:var(--sans); font-weight:800; font-size:23.5px; letter-spacing:3px;
    background:linear-gradient(90deg, #FFFFFF, var(--amber-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .sub{font-family:var(--mono); font-size:13px; color:var(--amber); letter-spacing:1.5px; opacity:0.85;}
  .status{display:flex; align-items:center; gap:22px; font-family:var(--mono); font-size:13.5px; color:var(--text-dim);}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--gain); display:inline-block; margin-right:6px; box-shadow:0 0 10px var(--gain); animation:pulse 2s ease-in-out infinite;}
  .dot.off{background:var(--loss); box-shadow:0 0 10px var(--loss); animation:none;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

  .layout{
    display:grid; grid-template-columns:390px 1fr; gap:1px; background:var(--border);
    min-height:calc(100vh - 62px);
  }
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }

  .panel{background:var(--panel); padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .panel-title{
    font-family:var(--mono); font-size:12.5px; letter-spacing:2.2px; color:var(--text-faint);
    text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;
    position:relative; padding-bottom:10px;
  }
  .panel-title::after{
    content:''; position:absolute; left:0; bottom:0; width:28px; height:2px;
    background:linear-gradient(90deg, var(--amber), transparent); border-radius:2px;
  }
  #chartSym{font-size:19px; letter-spacing:3px; color:var(--amber);}

  /* Watchlist */
  .add-row{display:flex; gap:6px;}
  .add-row input{
    flex:1; background:linear-gradient(180deg, #E8EAF0, #C9CDD8); border:1px solid #9CA2B3; color:#12151F;
    padding:13px 15px; border-radius:9px; font-family:var(--mono); font-size:17px; text-transform:uppercase;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .add-row input:focus{outline:none; border-color:var(--amber-dim); box-shadow:var(--glow);}
  .add-row button, .icon-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--amber);
    padding:9px 13px; border-radius:8px; cursor:pointer; font-family:var(--mono); font-size:15.5px;
    transition:all 0.15s;
  }
  .add-row button{padding:13px 18px; font-size:19px;}
  .add-row button:hover, .icon-btn:hover{border-color:var(--amber-dim); background:#1A1F2E; box-shadow:var(--glow); transform:translateY(-1px);}
  #scanNowBtn:hover{background:linear-gradient(180deg, #F1F3F7, #C6CAD6) !important; border-color:#B0B6C4 !important; color:#0B0E14 !important; box-shadow:0 0 14px rgba(200,205,215,0.35); transform:translateY(-1px);}
  #clearWatchlistBtn:hover{background:linear-gradient(180deg, #F1F3F7, #C6CAD6); border-color:#B0B6C4; box-shadow:0 0 14px rgba(200,205,215,0.35); transform:translateY(-1px);}

  .wl-grid{
    display:grid; grid-template-columns:1fr 90px 74px 74px 14px;
    column-gap:8px; align-items:center;
  }
  .wl-header{
    padding:0 12px 8px 12px; border-bottom:1px solid var(--border-soft); margin-bottom:2px;
  }
  .wl-header span{
    font-family:var(--mono); font-size:13px; letter-spacing:0.5px; color:var(--text-faint);
    text-transform:uppercase; text-align:right;
  }
  .wl-header span:first-child{text-align:left;}
  .coin-row{
    padding:10px 12px;
    border-radius:9px; cursor:pointer; border:1px solid transparent; position:relative;
    transition:background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .coin-row:hover{background:var(--panel-2); transform:translateX(2px);}
  .coin-row.active{background:linear-gradient(90deg, rgba(232,185,77,0.09), transparent); border-color:var(--amber-dim);}
  .coin-row.active::before{
    content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--amber), var(--amber-dim));
  }
  .coin-row .sym{font-weight:700; font-size:16.5px; letter-spacing:0.3px; min-width:0; display:flex; flex-wrap:wrap; align-items:center; row-gap:2px; column-gap:5px;}
  .coin-row .sym-text{white-space:nowrap; flex-shrink:0;}
  .coin-row .px{font-family:var(--mono); font-size:15.5px; color:var(--text); text-align:right;}
  .coin-row .chg{font-family:var(--mono); font-size:15px; font-weight:600; text-align:right;}
  .coin-row .rm{opacity:0; font-size:13px; color:var(--text-faint); transition:opacity 0.15s; text-align:right;}
  .coin-row:hover .rm{opacity:1;}
  .up{color:var(--gain);} .down{color:var(--loss);}
  .badge-new{
    font-family:var(--mono); font-size:10.5px; color:#0B0E14; background:var(--amber);
    padding:1px 5px; border-radius:4px; margin-left:6px; font-weight:700; letter-spacing:0.5px;
  }

  /* Main chart panel */
  .price-hero{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .price-hero .big-px{font-family:var(--mono); font-size:42.5px; font-weight:600; letter-spacing:-0.5px; text-shadow:0 0 24px rgba(232,185,77,0.15);}
  .price-hero .chg-big{font-family:var(--mono); font-size:16.5px; font-weight:600; padding:4px 10px; border-radius:6px; background:var(--panel-2);}
  .tf-toggle{display:flex; gap:4px;}
  .tf-toggle button{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
    padding:7px 13px; border-radius:7px; cursor:pointer; font-family:var(--mono); font-size:13.5px;
    transition:all 0.15s;
  }
  .tf-toggle button.active{color:#0B0E14; border-color:var(--amber); background:linear-gradient(180deg, var(--amber-2), var(--amber)); box-shadow:var(--glow);}
  .tf-toggle button:hover:not(.active){border-color:var(--amber-dim); color:var(--text);}
  .cond-row{display:flex; align-items:center; gap:7px;}
  .cond-row .cond-tf{
    font-family:var(--mono); font-size:12px; font-weight:700; color:var(--bg);
    background:var(--amber); padding:3px 8px; border-radius:6px; letter-spacing:0.3px;
  }
  .cond-row select, .cond-row input{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:6px 8px; border-radius:7px; font-family:var(--mono); font-size:13.5px;
  }
  .cond-row input{width:64px;}
  #chartWrap{position:relative;}
  #chartCanvas{width:100%; height:340px; display:block; border-radius:10px; background:#0A0D14; border:1px solid var(--border);}
  #rsiCanvas{width:100%; height:220px; display:block; border-radius:10px; background:#0A0D14; border:1px solid var(--border); margin-top:6px;}
  #chartTooltip{
    position:absolute; display:none; background:rgba(14,18,28,0.95); border:1px solid var(--amber-dim);
    border-radius:8px; padding:8px 11px; font-family:var(--mono); font-size:13px; color:var(--text-dim);
    line-height:1.6; pointer-events:none; z-index:5; box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  #chartTooltip b{color:var(--text);}
  .stats-row{display:flex; gap:26px; flex-wrap:wrap; font-family:var(--mono); font-size:14px; color:var(--text-dim);}
  .stats-row b{color:var(--text); font-weight:600;}

  /* Login screen */
  #loginScreen{
    position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,185,77,0.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(63,219,143,0.06), transparent 55%),
      var(--bg);
    padding:20px;
  }
  .login-box{
    width:100%; max-width:360px; background:linear-gradient(180deg, rgba(20,25,38,0.7), rgba(11,14,22,0.55));
    border:1px solid var(--border); border-radius:16px; padding:32px 28px; backdrop-filter:blur(8px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .login-brand{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
  .login-brand img{
    height:48px; width:auto; border-radius:9px; border:2px solid var(--amber);
    box-shadow:0 6px 14px rgba(0,0,0,0.5);
  }
  .login-title{
    font-family:var(--sans); font-weight:800; font-size:19px; letter-spacing:2.5px;
    background:linear-gradient(90deg, #FFFFFF, var(--amber-2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .login-sub{font-family:var(--mono); font-size:11.5px; color:var(--amber); letter-spacing:1.3px; opacity:0.85; margin-top:2px;}
  .login-fields{display:flex; flex-direction:column; gap:12px;}
  .login-input{
    background:linear-gradient(180deg, #E8EAF0, #C9CDD8); border:1.5px solid var(--amber); color:#12151F;
    padding:13px 15px; border-radius:9px; font-family:var(--mono); font-size:15.5px; width:100%;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .login-input:focus{outline:none; border-color:var(--amber-dim); box-shadow:var(--glow);}
  .login-pw-wrap{position:relative; display:flex; align-items:center;}
  .login-pw-wrap .login-input{padding-right:60px;}
  .login-pw-toggle{
    position:absolute; right:8px; background:none; border:none; color:var(--text-faint);
    font-family:var(--mono); font-size:11px; letter-spacing:0.5px; cursor:pointer; padding:6px 8px;
  }
  .login-pw-toggle:hover{color:var(--amber-dim);}
  .login-error{
    min-height:18px; font-family:var(--mono); font-size:12.5px; color:var(--loss); margin-top:12px;
  }
  .login-submit{
    width:100%; margin-top:6px; background:linear-gradient(180deg, var(--amber-2), var(--amber)); border:1px solid var(--amber);
    color:#12151F; font-family:var(--sans); font-weight:700; font-size:15px; letter-spacing:0.5px;
    padding:13px 15px; border-radius:9px; cursor:pointer; transition:all 0.15s;
  }
  .login-submit:hover{box-shadow:var(--glow); transform:translateY(-1px);}
  .login-submit:disabled{opacity:0.6; cursor:default; transform:none; box-shadow:none;}
  .login-note{
    margin-top:16px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.3px;
  }

  /* Scan */
  .scan-card{
    border:1px solid var(--border); border-radius:9px; padding:11px 12px;
    display:flex; flex-direction:column; gap:5px; background:var(--panel-2); cursor:pointer;
    position:relative; overflow:hidden; transition:transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .scan-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--amber), var(--amber-dim));
  }
  .scan-card:hover{border-color:var(--amber-dim); transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,0.35), var(--glow);}
  .scan-card .sym{font-weight:700; font-size:15px;}
  .scan-card .rsi{font-family:var(--mono); font-size:19px; font-weight:700; color:var(--amber);}
  .scan-card .px{font-family:var(--mono); font-size:13px; color:var(--text-dim);}

  #scanProgressWrap{
    display:none; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; position:relative;
    border:1px solid var(--border);
  }
  #scanProgressBar{
    height:100%; width:0%; border-radius:4px; transition:width 0.25s ease-out;
    background:linear-gradient(90deg, var(--amber-dim), var(--amber), var(--amber-2));
    background-size:200% 100%; animation:shimmer 1.1s linear infinite;
    box-shadow:0 0 10px rgba(232,185,77,0.5);
  }
  @keyframes shimmer{ 0%{background-position:0% 0;} 100%{background-position:-200% 0;} }
  #scanProgressLabel{
    font-family:var(--mono); font-size:12.5px; color:var(--amber); text-align:right; margin-top:4px; display:none;
  }

  #toast{
    position:fixed; top:70px; right:24px; z-index:50; display:flex; flex-direction:column; gap:8px;
  }
  .toast-item{
    background:linear-gradient(135deg, #1B1710, #14120C); border:1px solid var(--amber); color:var(--amber-2);
    padding:13px 17px; border-radius:10px; font-family:var(--mono); font-size:15px;
    box-shadow:0 10px 28px rgba(0,0,0,0.55), 0 0 20px rgba(232,185,77,0.12); animation:slidein 0.3s ease-out; min-width:220px; max-width:340px;
  }
  @keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .empty{color:var(--text-faint); font-size:14px; font-family:var(--mono); padding:8px 2px;}
</style>
</head>

<script>
// ---------- login gate ----------
const ALLOWED_USERS = { "AquaMelody": "Melody5230502134#" };
const SESSION_KEY = "session:v1";

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
}
function showLogin(msg){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginError').textContent = msg || '';
  document.getElementById('loginPw').value = '';
  setTimeout(()=>document.getElementById(document.getElementById('loginId').value ? 'loginPw' : 'loginId').focus(), 0);
}
async function attemptLogin(){
  const idEl = document.getElementById('loginId');
  const pwEl = document.getElementById('loginPw');
  const btn = document.getElementById('loginBtn');
  const id = idEl.value.trim();
  const pw = pwEl.value;
  if(!id || !pw){ document.getElementById('loginError').textContent = 'Please enter ID and password'; return; }
  btn.disabled = true; btn.textContent = 'Checking...';
  await new Promise(r=>setTimeout(r, 250)); // brief pause so it doesn't feel instantaneous/guessable
  btn.disabled = false; btn.textContent = 'Log In';

// ---------- resilient fetch (falls back to proxies if OKX is blocked, e.g. ISP-level block in TH) ----------
const OKX_ROUTES = [
  { name: 'Direct', wrap: null },
  { name: 'Cloudflare Worker', wrap: (u) => `https://okx-proxy.kwanchainrru.workers.dev/?url=${encodeURIComponent(u)}` },
  { name: 'allorigins', wrap: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
  { name: 'codetabs', wrap: (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },
  { name: 'corsproxy.io', wrap: (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}` },
];
let okxRouteIdx = 0;
let okxRouteNotified = false;

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    return await fetch(url, {signal: controller.signal});
  }finally{
    clearTimeout(timer);
  }
}

async function okxFetchJson(url){
  const order = [okxRouteIdx, ...OKX_ROUTES.map((_,i)=>i).filter(i=>i!==okxRouteIdx)];
  let lastErr;
  for(const idx of order){
    const { name, wrap } = OKX_ROUTES[idx];
    const target = wrap ? wrap(url) : url;
    const timeoutMs = wrap ? 12000 : 4000;
    const maxAttempts = wrap ? 3 : 1; // retry the same route on rate limits, but not the (fast-fail) direct route
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      try{
        const res = await fetchWithTimeout(target, timeoutMs);
        if(res.status === 429 && attempt < maxAttempts){
          console.warn(`[OKX route "${name}"] 429, retrying in ${attempt*800}ms...`);
          await new Promise(r=>setTimeout(r, attempt*800));
          continue;
        }
        if(!res.ok){ console.warn(`[OKX route "${name}"] HTTP ${res.status} for ${url}`); throw new Error('HTTP '+res.status); }
        const json = await res.json();
        console.log(`[OKX route "${name}"] OK for ${url}`);
        if(idx !== okxRouteIdx){
          okxRouteIdx = idx;
          if(!okxRouteNotified){
            okxRouteNotified = true;
            toast(`Could not connect directly to OKX (may be blocked in your country) — switching to alternate route (${name}) instead`);
          }
        }
        return json;
      }catch(e){
        console.warn(`[OKX route "${name}"] failed for ${url}:`, e.message||e);
        lastErr = e;
        break; // non-429 failure: stop retrying this route, move to next
      }
    }
  }
  throw lastErr;
}

// Simple moving average over a nullable series (e.g. RSI values before the warm-up period).
// Skips nulls when building the rolling window, and only emits a value once `period` real
// data points have been seen — same behaviour as TradingView's RSI-based MA line.
function calcSMA(values, period){
  const out = new Array(values.length).fill(null);
  const queue = [];
  let sum = 0;
  for(let i=0;i<values.length;i++){
    const v = values[i];
    if(v == null) continue;
    queue.push(v); sum += v;
    if(queue.length > period) sum -= queue.shift();
    if(queue.length === period) out[i] = sum/period;
  }
  return out;
}

function calcRSI(closes, period=14){
  if(closes.length < period+1) return closes.map(()=>null);
  const rsis = new Array(closes.length).fill(null);
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    const diff = closes[i]-closes[i-1];
    if(diff>=0) gains+=diff; else losses-=diff;
  }
  let avgGain = gains/period, avgLoss = losses/period;
  rsis[period] = avgLoss===0 ? 100 : 100 - 100/(1+avgGain/avgLoss);
  for(let i=period+1;i<closes.length;i++){
    const diff = closes[i]-closes[i-1];
    const gain = diff>0?diff:0, loss = diff<0?-diff:0;
    avgGain = (avgGain*(period-1)+gain)/period;
    avgLoss = (avgLoss*(period-1)+loss)/period;
    rsis[i] = avgLoss===0 ? 100 : 100 - 100/(1+avgGain/avgLoss);
  }
  return rsis;
}

// OKX's plain "1D"/"1W"/etc bars use Hong Kong time (UTC+8) as the day boundary.
// Most charting tools (e.g. TradingView's default) use UTC day boundaries instead.
// During fast moves this can meaningfully shift the still-forming "today" candle's
// OHLC between the two conventions, which shifts RSI too. We request OKX's "utc"
// variant so our daily/weekly candles line up with what people are used to seeing.
function toOkxBar(bar){
  const utcVariants = { '1D':'1Dutc', '2D':'2Dutc', '3D':'3Dutc', '1W':'1Wutc', '1M':'1Mutc', '3M':'3Mutc' };
  return utcVariants[bar] || bar;
}

async function getCandles(inst, bar, forceFresh){
  const key = inst+'|'+bar;
  const c = candleCache[key];
  if(!forceFresh && c && (Date.now()-c.ts < 20000)) return c.candles;
  try{
    const json = await okxFetchJson(OKX_CANDLES(inst,toOkxBar(bar)));
    if(json.code !== "0") throw new Error("api error");
    const arr = json.data.map(x=>({t:parseInt(x[0]), o:parseFloat(x[1]), h:parseFloat(x[2]), l:parseFloat(x[3]), c:parseFloat(x[4])})).reverse();
    candleCache[key] = {candles:arr, ts:Date.now()};
    return arr;
  }catch(e){
    return c ? c.candles : [];
  }
}

// ---------- today / yesterday % (open→now, open→close of the daily 1D candle) ----------
// Keyed by instId: { today: pct|null, yesterday: pct|null } where pct is a fraction (0.068 = +6.8%)
let dailyChangeData = {};
async function refreshDailyChanges(){
  const insts = Array.from(new Set(watchlist));
  await Promise.all(insts.map(async inst=>{
    const arr = await getCandles(inst, '1D', false);
    if(!arr || arr.length < 1){ dailyChangeData[inst] = {today:null, yesterday:null}; return; }
    const todayCandle = arr[arr.length-1]; // still-forming daily candle
    const todayPct = todayCandle && todayCandle.o ? (todayCandle.c - todayCandle.o)/todayCandle.o : null;
    let yesterdayPct = null;
    if(arr.length >= 2){
      const yCandle = arr[arr.length-2]; // last fully-closed daily candle
      if(yCandle && yCandle.o) yesterdayPct = (yCandle.c - yCandle.o)/yCandle.o;
    }
    dailyChangeData[inst] = {today: todayPct, yesterday: yesterdayPct};
  }));
  renderWatchlist();
}

function fmtPx(n){
  n = Number(n);
  if(!isFinite(n)) return "—";
  if(n >= 1000) return n.toLocaleString(undefined,{maximumFractionDigits:2});
  if(n >= 1) return n.toLocaleString(undefined,{maximumFractionDigits:4});
  return n.toLocaleString(undefined,{maximumFractionDigits:6});
}

function chartMetrics(rect){
  const padL = 8, padR = 58, padT = 14, padB = 22;
  const plotW = rect.width - padL - padR, plotH = rect.height - padT - padB;
  const n = candles.length;
  const cw = n ? plotW / n : 0;
  return {padL, padR, padT, padB, plotW, plotH, n, cw};
}

function drawChart(){
  const canvas = document.getElementById('chartCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0,0,W,H);
  if(candles.length === 0) return;

  const {padL, padR, padT, plotW, plotH, n, cw} = chartMetrics(rect);

  let allVals = [];
  candles.forEach(c=>{ allVals.push(c.h, c.l); });
  let min = Math.min(...allVals), max = Math.max(...allVals);
  const pad = (max-min)*0.08 || max*0.01 || 1;
  min -= pad; max += pad;
  const yOf = v => padT + plotH - ((v-min)/(max-min))*plotH;

  // fine grid (TradingView-style subtle grid)
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
  for(let i=1;i<8;i++){
    const x = padL + plotW*i/8;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT+plotH); ctx.stroke();
  }

  ctx.strokeStyle = '#161B29'; ctx.font = '12px "JetBrains Mono", monospace';
  ctx.fillStyle = '#525A70';
  const gridN = 4;
  for(let i=0;i<=gridN;i++){
    const v = min + (max-min)*i/gridN;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(fmtPx(v), W-padR+7, y+3);
  }

  // candles
  candles.forEach((c,i)=>{
    const x = padL + i*cw + cw/2;
    const up = c.c >= c.o;
    const col = up ? '#3FDB8F' : '#E8B94D';
    ctx.strokeStyle = col; ctx.fillStyle = col;
    if(hoverIndex === i){
      ctx.save(); ctx.fillStyle = 'rgba(232,185,77,0.08)';
      ctx.fillRect(padL + i*cw, padT, cw, plotH);
      ctx.restore();
      ctx.strokeStyle = col; ctx.fillStyle = col;
    }
    ctx.beginPath(); ctx.moveTo(x, yOf(c.h)); ctx.lineTo(x, yOf(c.l)); ctx.stroke();
    const bodyW = Math.max(cw*0.55, 1.5);
    const yO = yOf(c.o), yC = yOf(c.c);
    ctx.fillRect(x-bodyW/2, Math.min(yO,yC), bodyW, Math.max(Math.abs(yC-yO),1));
  });

  // current price dashed line + tag
  const last = getQuote(selected) ? getQuote(selected).last : candles[candles.length-1].c;
  const yLast = yOf(last);
  ctx.setLineDash([4,4]); ctx.strokeStyle = '#E8B94D'; ctx.beginPath();
  ctx.moveTo(padL, yLast); ctx.lineTo(W-padR, yLast); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#E8B94D'; ctx.fillRect(W-padR, yLast-8, 52, 16);
  ctx.fillStyle = '#0B0E14'; ctx.font = 'bold 12px "JetBrains Mono", monospace';
  ctx.fillText(fmtPx(last), W-padR+5, yLast+3.5);

  // crosshair
  if(hoverIndex != null && candles[hoverIndex]){
    const c = candles[hoverIndex];
    const x = padL + hoverIndex*cw + cw/2;
    const y = yOf(c.c);
    ctx.setLineDash([3,3]); ctx.strokeStyle = 'rgba(237,238,242,0.35)';
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT+plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // x labels (first/last time)
  ctx.fillStyle = '#525A70'; ctx.font = '11.5px "JetBrains Mono", monospace';
  const fmtT = t => new Date(t).toLocaleString('th-TH',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  ctx.fillText(fmtT(candles[0].t), padL, H-6);
  const lastLabel = fmtT(candles[candles.length-1].t);
  ctx.fillText(lastLabel, W-padR-70, H-6);
}

function drawRSIChart(){
  const canvas = document.getElementById('rsiCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0,0,W,H);
  if(candles.length < 15){ lastRSI = null; return; }

  const closes = candles.map(c=>c.c);
  const rsis = calcRSI(closes, 14);
  const rsiMA = calcSMA(rsis, 14);
  lastRSI = rsis[rsis.length-1];
  const lastRSIMA = rsiMA[rsiMA.length-1];

  const padL = 8, padR = 58, padT = 10, padB = 6;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const yOf = v => padT + plotH - (v/100)*plotH;

  ctx.fillStyle = 'rgba(239,95,102,0.06)';
  ctx.fillRect(padL, yOf(100), plotW, yOf(70)-yOf(100));
  ctx.fillStyle = 'rgba(63,219,143,0.06)';
  ctx.fillRect(padL, yOf(30), plotW, yOf(0)-yOf(30));

  ctx.strokeStyle = '#161B29'; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(padL, yOf(50)); ctx.lineTo(W-padR, yOf(50)); ctx.stroke();

  ctx.strokeStyle = 'rgba(237,238,242,0.55)'; ctx.setLineDash([1,3]); ctx.lineWidth = 1;
  [70,30].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(padL, yOf(v)); ctx.lineTo(W-padR, yOf(v)); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.fillStyle = '#525A70'; ctx.font = '11.5px "JetBrains Mono", monospace';
  ctx.fillText('70', W-padR+7, yOf(70)+3);
  ctx.fillText('30', W-padR+7, yOf(30)+3);

  const n = candles.length;
  const cw = plotW / n;
  ctx.strokeStyle = '#2454D6'; ctx.lineWidth = 1.6; ctx.beginPath();
  let started = false;
  rsis.forEach((v,i)=>{
    if(v==null) return;
    const x = padL + i*cw + cw/2;
    const y = yOf(v);
    if(!started){ ctx.moveTo(x,y); started = true; } else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // MA of RSI — same idea as TradingView's built-in RSI moving-average line
  ctx.strokeStyle = '#E8B94D'; ctx.lineWidth = 1.4; ctx.beginPath();
  started = false;
  rsiMA.forEach((v,i)=>{
    if(v==null) return;
    const x = padL + i*cw + cw/2;
    const y = yOf(v);
    if(!started){ ctx.moveTo(x,y); started = true; } else ctx.lineTo(x,y);
  });
  ctx.stroke();

  if(hoverIndex != null && rsis[hoverIndex]!=null){
    const x = padL + hoverIndex*cw + cw/2;
    const y = yOf(rsis[hoverIndex]);
    ctx.setLineDash([3,3]); ctx.strokeStyle = 'rgba(237,238,242,0.35)';
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT+plotH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#2454D6'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    if(rsiMA[hoverIndex]!=null){
      const yMa = yOf(rsiMA[hoverIndex]);
      ctx.fillStyle = '#E8B94D'; ctx.beginPath(); ctx.arc(x, yMa, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  if(lastRSI!=null){
    const y = yOf(lastRSI);
    ctx.fillStyle = '#2454D6'; ctx.fillRect(W-padR, y-8, 52, 16);
    ctx.fillStyle = '#EDEEF2'; ctx.font = 'bold 11.5px "JetBrains Mono", monospace';
    ctx.fillText(lastRSI.toFixed(1), W-padR+5, y+3.5);
  }
  if(lastRSIMA!=null){
    const y = yOf(lastRSIMA);
    ctx.fillStyle = '#E8B94D'; ctx.fillRect(W-padR, y-8, 52, 16);
    ctx.fillStyle = '#0B0E14'; ctx.font = 'bold 11.5px "JetBrains Mono", monospace';
    ctx.fillText(lastRSIMA.toFixed(1), W-padR+5, y+3.5);
  }
}

// ---------- crosshair interaction ----------
function attachCrosshair(){
  const canvas = document.getElementById('chartCanvas');
  const tip = document.getElementById('chartTooltip');
  canvas.addEventListener('mousemove', (e)=>{
    if(!candles.length) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const {padL, n, cw} = chartMetrics(rect);
    let idx = Math.floor((x - padL) / cw);
    idx = Math.max(0, Math.min(n-1, idx));
    hoverIndex = idx;
    drawChart(); drawRSIChart();
    const c = candles[idx];
    const chg = c.o ? ((c.c-c.o)/c.o*100) : 0;
    tip.style.display = 'block';
    const left = Math.min(rect.width-165, Math.max(0, x+14));
    tip.style.left = left + 'px';
    tip.style.top = '8px';
    tip.innerHTML = `<b>${new Date(c.t).toLocaleString('th-TH',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</b><br>
      O <b>${fmtPx(c.o)}</b>&nbsp; H <b>${fmtPx(c.h)}</b><br>
      L <b>${fmtPx(c.l)}</b>&nbsp; C <b style="color:${chg>=0?'var(--gain)':'var(--loss)'}">${fmtPx(c.c)}</b> <span style="color:${chg>=0?'var(--gain)':'var(--loss)'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`;
  });
  canvas.addEventListener('mouseleave', ()=>{
    hoverIndex = null; tip.style.display='none'; drawChart(); drawRSIChart();
  });
}

// ---------- scan ----------
function setScanStatus(text){ document.getElementById('scanStatus').textContent = text; }

function setScanProgress(pct){
  const wrap = document.getElementById('scanProgressWrap');
  const bar = document.getElementById('scanProgressBar');
  const label = document.getElementById('scanProgressLabel');
  if(pct == null){ wrap.style.display = 'none'; label.style.display = 'none'; return; }
  wrap.style.display = 'block'; label.style.display = 'block';
  bar.style.width = pct + '%';
  label.textContent = pct + '%';
}

async function scanMarket(){
  if(scanning) return;
  scanning = true;
  setScanStatus('Scanning…');

  await fetchFuturesTickers();

  let universe = Object.keys(futuresTickerData);
  universe.sort((a,b) => (futuresTickerData[b].vol24h||0) - (futuresTickerData[a].vol24h||0));
  universe = universe.slice(0, Math.max(1, scanConfig.limit||150));

  const conditions = (scanConfig.conditions && scanConfig.conditions.length) ? scanConfig.conditions : [{bar:'1D', dir:'above', value:85}];
  const smaConditions = scanConfig.smaConditions || [];

  // build the full task list: every instrument checked against every selected TF's own RSI condition
  const tasks = [];
  for(const cond of conditions){
    for(const inst of universe) tasks.push({ type:'rsi', inst, bar: cond.bar, dir: cond.dir, value: cond.value });
  }
  // plus, for each selected TF, a separate pass checking the SMA(14)-of-RSI value itself against a
  // threshold — same shape as the RSI conditions above but comparing the SMA line, not RSI directly
  for(const cond of smaConditions){
    for(const inst of universe) tasks.push({ type:'smaval', inst, bar: cond.bar, dir: cond.dir, value: cond.value });
  }
  // plus, if enabled, a separate pass checking each instrument's "yesterday" daily-candle % change
  // (open→close of the last fully-closed 1D candle) against a single threshold
  if(scanConfig.ydayPctEnabled){
    for(const inst of universe) tasks.push({ type:'ydaypct', inst, bar:'1D', value: scanConfig.ydayPctValue });
  }

  const results = [];
  const failed = [];
  const rsiByInst = {}; // inst -> { [bar]: {hit, val, sma, diff, dir, value} } — filled in first, results assembled after per OR/AND mode
  const smaByInst = {}; // inst -> { [bar]: {hit, sma, dir, value} } — SMA(14)-of-RSI value condition results
  let done = 0;
  const concurrency = 3;
  let cursor = 0;
  async function checkOne(task){
    if(task.type === 'ydaypct'){
      const { inst, bar, value } = task;
      const arr = await getCandles(inst, bar);
      if(!arr || arr.length < 2) throw new Error('no candle data');
      const yCandle = arr[arr.length-2]; // last fully-closed daily candle
      if(!yCandle || !yCandle.o) throw new Error('no yesterday candle');
      const pct = (yCandle.c - yCandle.o)/yCandle.o*100;
      if(pct >= value) results.push({ inst, bar, type:'ydaypct', value, pct });
      return;
    }
    if(task.type === 'smaval'){
      const { inst, bar, dir, value } = task;
      const arr = await getCandles(inst, bar);
      if(!arr || arr.length < 15) throw new Error('no candle data');
      const closes = arr.map(c=>c.c);
      const rsis = calcRSI(closes, 14);
      // RSI needs `period` extra warm-up points before its own SMA can start — treat "not enough
      // data yet" as a miss on this filter rather than a fetch failure.
      const rsiMA = calcSMA(rsis, 14);
      const smaVal = rsiMA[rsiMA.length-1];
      if(smaVal == null) throw new Error('sma warm-up incomplete');
      const hit = dir === 'above' ? smaVal >= value : smaVal <= value;
      if(!smaByInst[inst]) smaByInst[inst] = {};
      smaByInst[inst][bar] = { hit, sma: smaVal, dir, value };
      return;
    }
    const { inst, bar, dir, value } = task;
    const arr = await getCandles(inst, bar);
    if(!arr || arr.length < 15) throw new Error('no candle data'); // treat empty/short data as a failure, not "no signal"
    const closes = arr.map(c=>c.c);
    const rsis = calcRSI(closes, 14);
    const val = rsis[rsis.length-1];
    if(val == null) throw new Error('rsi warm-up incomplete');

    let hit, smaVal = null, diff = null;

    hit = dir === 'above' ? val >= value : val <= value;
    if(hit && scanConfig.smaDiffEnabled){
      // RSI needs `period` extra warm-up points before its own SMA can start, so this
      // requires more history than the base RSI check above — treat "not enough data yet"
      // as a miss on this filter rather than a fetch failure.
      const rsiMA = calcSMA(rsis, 14);
      smaVal = rsiMA[rsiMA.length-1];
      if(smaVal == null){ hit = false; }
      else{
        diff = Math.abs(val - smaVal);
        if(diff > scanConfig.smaDiffValue) hit = false;
      }
    }
    if(!rsiByInst[inst]) rsiByInst[inst] = {};
    rsiByInst[inst][bar] = { hit, val, sma: smaVal, diff, dir, value };
  }
  async function worker(list, delayMs){
    while(cursor < list.length){
      const task = list[cursor++];
      try{
        await checkOne(task);
      }catch(e){
        failed.push(task);
      }
      done++;
      setScanProgress(Math.round(done/tasks.length*100));
      await new Promise(r=>setTimeout(r, delayMs)); // stagger requests so we don't trip the proxy's rate limit
    }
  }
  await Promise.all(Array.from({length: Math.min(concurrency, tasks.length)}, ()=>worker(tasks, 120)));

  // retry pass: instrument/TF pairs that failed (often proxy rate-limits, not "no signal") get one more
  // slower, lower-concurrency shot before we treat them as unreadable
  let stillFailed = [];
  if(failed.length){
    setScanStatus(`Retrying ${failed.length} items that failed to fetch on first pass…`);
    cursor = 0;
    const retryList = failed.slice();
    const retryFailed = [];
    async function retryWorker(){
      while(cursor < retryList.length){
        const task = retryList[cursor++];
        try{ await checkOne(task); }
        catch(e){ retryFailed.push(task); }
        await new Promise(r=>setTimeout(r, 400)); // slower on retry to actually clear rate limits
      }
    }
    await Promise.all(Array.from({length: Math.min(2, retryList.length)}, retryWorker));
    stillFailed = retryFailed;
  }

  // assemble RSI results from rsiByInst per the selected logic mode
  const logicMode = (scanConfig.logic === 'and') ? 'and' : 'or';
  if(logicMode === 'and' && conditions.length > 1){
    // AND: an instrument only counts if EVERY selected TF condition hit simultaneously
    for(const inst of universe){
      const map = rsiByInst[inst];
      if(!map) continue;
      let allHit = true;
      const bars = [];
      for(const cond of conditions){
        const r = map[cond.bar];
        if(!r || !r.hit){ allHit = false; break; }
        bars.push({ bar: cond.bar, dir: cond.dir, value: cond.value, rsi: r.val, sma: r.sma, diff: r.diff });
      }
      if(allHit) results.push({ inst, type:'rsi-and', bars });
    }
  }else{
    // OR (default): any instrument matching any single TF condition counts, one entry per matching TF
    for(const inst of universe){
      const map = rsiByInst[inst];
      if(!map) continue;
      for(const cond of conditions){
        const r = map[cond.bar];
        if(r && r.hit) results.push({ inst, bar: cond.bar, type:'rsi', dir: cond.dir, value: cond.value, rsi: r.val, sma: r.sma, diff: r.diff });
      }
    }
  }

  // SMA(14)-of-RSI value conditions — an independent OR pass across whichever TFs were selected,
  // same treatment as the yesterday-% pass rather than mixed into the RSI AND/OR logic above
  for(const cond of smaConditions){
    for(const inst of universe){
      const r = smaByInst[inst] && smaByInst[inst][cond.bar];
      if(r && r.hit) results.push({ inst, bar: cond.bar, type:'smaval', dir: cond.dir, value: cond.value, sma: r.sma });
    }
  }

  // group by TF (in the order the conditions are defined) so each timeframe's results sort by its own direction;
  // yesterday-%-change results (no TF grouping concept) sort to the end, highest % first;
  // AND-mode combined results keep universe (volume-desc) order since they don't belong to a single TF
  const barRank = {};
  conditions.forEach((c,i)=>{ barRank[c.bar] = i; });
  smaConditions.forEach((c,i)=>{ if(!(c.bar in barRank)) barRank[c.bar] = conditions.length + i; });
  const universeRank = {}; universe.forEach((inst,i)=>{ universeRank[inst] = i; });
  results.sort((a,b) => {
    if(a.type === 'ydaypct' && b.type === 'ydaypct') return b.pct - a.pct;
    if(a.type === 'ydaypct') return 1;
    if(b.type === 'ydaypct') return -1;
    if(a.type === 'rsi-and' && b.type === 'rsi-and') return universeRank[a.inst] - universeRank[b.inst];
    if(barRank[a.bar] !== barRank[b.bar]) return barRank[a.bar] - barRank[b.bar];
    if(a.type === 'smaval' || b.type === 'smaval'){
      if(a.type !== b.type) return a.type === 'smaval' ? 1 : -1;
      return a.dir === 'above' ? b.sma - a.sma : a.sma - b.sma;
    }
    return a.dir === 'above' ? b.rsi - a.rsi : a.rsi - b.rsi;
  });
  scanResults = results;
  renderScanResults();
  await addScanResultsToWatchlist(results);
  notifyScanHits(results);

  scanning = false;
  setScanProgress(null);
  const failNote = stillFailed.length ? ` · ${stillFailed.length} items failed to fetch (not counted as "no match")` : '';
  const tfNote = conditions.length > 1
    ? ` · TF(${logicMode==='and'?'AND':'OR'}): ${conditions.map(c=>`${BAR_LABEL[c.bar]||c.bar}(${c.dir==='above'?'≥':'≤'}${c.value})`).join(', ')}`
    : '';
  const smaValNote = smaConditions.length
    ? ` · SMA(14): ${smaConditions.map(c=>`${BAR_LABEL[c.bar]||c.bar}(${c.dir==='above'?'≥':'≤'}${c.value})`).join(', ')}`
    : '';
  const ydayNote = scanConfig.ydayPctEnabled ? ` · %Yesterday≥${scanConfig.ydayPctValue}%` : '';
  setScanStatus(`Last scan ${new Date().toLocaleTimeString('en-US',{hour12:false})} · ${universe.length} contracts${tfNote}${smaValNote}${ydayNote} · found ${results.length} items${failNote}`);
  if(stillFailed.length){
    console.warn('Instrument/TF pairs that could not be scanned (data fetch failed twice):', stillFailed);
  }
}

async function addScanResultsToWatchlist(results){
  if(!results.length) return;
  recentlyAdded = new Set();
  let changed = false;
  for(const r of results){
    const spotInst = instLabel(r.inst) + '-USDT';
    // prefer the spot pair, but if OKX has no spot market for this coin, track the futures instrument itself
    const instToAdd = tickerData[spotInst] ? spotInst : r.inst;
    recentlyAdded.add(instToAdd);
    if(!watchlist.includes(instToAdd) && !watchlist.includes(spotInst) && !watchlist.includes(r.inst)){
      watchlist.push(instToAdd);
      changed = true;
    }
  }
  if(changed){
    await saveWatchlist();
    await fetchTickers();
    refreshDailyChanges();
  }
  renderWatchlist();
}

function armKey(r){
  if(r.type === 'rsi-and') return `${r.inst}|AND|${r.bars.map(b=>b.bar).join(',')}`;
  return `${r.inst}|${r.bar}|${r.type||'rsi'}`;
}
function notifyScanHits(results){
  const hitSet = new Set(results.map(armKey));
  Object.keys(scanArmed).forEach(k => { if(!hitSet.has(k)) scanArmed[k] = true; });
  const newly = results.filter(r => scanArmed[armKey(r)] !== false);
  if(newly.length){
    const lines = newly.map(r => {
      if(r.type === 'ydaypct'){
        return `${instLabel(r.inst)} (%Yesterday ≥ ${r.value}%) +${r.pct.toFixed(2)}%`;
      }
      if(r.type === 'rsi-and'){
        const parts = r.bars.map(b => `${BAR_LABEL[b.bar]||b.bar} ${b.dir==='above'?'≥':'≤'}${b.value} (${b.rsi.toFixed(1)})`);
        return `${instLabel(r.inst)} [AND all TF] ${parts.join(' & ')}`;
      }
      const barLabel = BAR_LABEL[r.bar] || r.bar;
      if(r.type === 'smaval'){
        return `${instLabel(r.inst)} (${barLabel} SMA(14) ${r.dir==='above'?'≥':'≤'}${r.value}) SMA ${r.sma.toFixed(1)}`;
      }
      const diffPart = (scanConfig.smaDiffEnabled && r.diff != null) ? ` (Δ${r.diff.toFixed(1)})` : '';
      return `${instLabel(r.inst)} (${barLabel} ${r.dir==='above'?'≥':'≤'}${r.value}) ${r.rsi.toFixed(1)}${diffPart}`;
    });
    const smaCond = scanConfig.smaDiffEnabled ? ` and |RSI−SMA(14)| ≤ ${scanConfig.smaDiffValue}` : '';
    const msg = `Found ${newly.length} futures contracts matching condition${smaCond} : \n${lines.join('\n')}`;
    toast(`📡 Found ${newly.length} matching contracts — alert sent to Telegram`);
    beep();
    sendTelegram(msg);
  }
  newly.forEach(r => scanArmed[armKey(r)] = false);
}

    const d = futuresTickerData[r.inst];
    if(r.type === 'ydaypct'){
      return `<div class="scan-card" data-inst="${r.inst}" title="Open in OKX Futures">
        <span class="sym">${instLabel(r.inst)} <span style="color:var(--text-faint); font-weight:400;">PERP</span></span>
        <span class="tf-badge" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--bg); background:var(--gain); padding:1px 6px; border-radius:5px; letter-spacing:0.3px; align-self:flex-start;">%Yesterday</span>
        <span class="rsi" style="color:var(--gain);">+${r.pct.toFixed(2)}%</span>
        <span class="px">${d?fmtPx(d.last):'—'}</span>
      </div>`;
    }
    if(r.type === 'rsi-and'){
      const badges = r.bars.map(b => `<span class="tf-badge" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--bg); background:var(--amber-dim); padding:1px 6px; border-radius:5px; letter-spacing:0.3px;">${BAR_LABEL[b.bar]||b.bar} ${b.rsi.toFixed(1)}</span>`).join('');
      return `<div class="scan-card" data-inst="${r.inst}" title="Open in OKX Futures">
        <span class="sym">${instLabel(r.inst)} <span style="color:var(--text-faint); font-weight:400;">PERP</span></span>
        <div style="display:flex; flex-wrap:wrap; gap:4px;">
          <span class="tf-badge" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--bg); background:var(--gain); padding:1px 6px; border-radius:5px; letter-spacing:0.3px;">AND</span>
          ${badges}
        </div>
        <span class="px">${d?fmtPx(d.last):'—'}</span>
      </div>`;
    }
    const barLabel = BAR_LABEL[r.bar] || r.bar;
    if(r.type === 'smaval'){
      return `<div class="scan-card" data-inst="${r.inst}" title="Open in OKX Futures">
        <span class="sym">${instLabel(r.inst)} <span style="color:var(--text-faint); font-weight:400;">PERP</span></span>
        <span class="tf-badge" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--bg); background:var(--gain); padding:1px 6px; border-radius:5px; letter-spacing:0.3px; align-self:flex-start;">${barLabel} · SMA</span>
        <span class="rsi">${r.sma.toFixed(1)}</span>
        <span class="px">${d?fmtPx(d.last):'—'}</span>
      </div>`;
    }
    const diffLine = (scanConfig.smaDiffEnabled && r.diff != null)
      ? `<span style="color:var(--text-faint); font-size:11px;">Δ${r.diff.toFixed(1)} (SMA ${r.sma.toFixed(1)})</span>` : '';
    return `<div class="scan-card" data-inst="${r.inst}" title="Open in OKX Futures">
      <span class="sym">${instLabel(r.inst)} <span style="color:var(--text-faint); font-weight:400;">PERP</span></span>
      <span class="tf-badge" style="font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--bg); background:var(--amber-dim); padding:1px 6px; border-radius:5px; letter-spacing:0.3px; align-self:flex-start;">${barLabel}</span>
      <span class="rsi">${r.rsi.toFixed(1)}</span>
      <span class="px">${d?fmtPx(d.last):'—'}</span>
      ${diffLine}
    </div>`;
  }).join('');
  el.querySelectorAll('.scan-card').forEach(card => {
    card.addEventListener('click', () => {
      const slug = card.dataset.inst.toLowerCase();
      window.open(`https://www.okx.com/trade-swap/${slug}`, '_blank', 'noopener');
    });
  });
}

const BAR_ORDER = ['5m','15m','1H','4H','1D','1W'];

function renderConditionRows(){
  const wrap = document.getElementById('scanConditionsRow');
  const sorted = scanConfig.conditions.slice().sort((a,b)=>BAR_ORDER.indexOf(a.bar)-BAR_ORDER.indexOf(b.bar));
  wrap.innerHTML = sorted.map(c => `
    <div class="cond-row" data-bar="${c.bar}">
      <span class="cond-tf">${BAR_LABEL[c.bar]||c.bar}</span>
      <span style="font-family:var(--mono); font-size:13px; color:var(--text-dim);">RSI(14)</span>
      <select class="cond-dir">
        <option value="above" ${c.dir==='above'?'selected':''}>≥</option>
        <option value="below" ${c.dir==='below'?'selected':''}>≤</option>
      </select>
      <input class="cond-value" type="number" step="any" value="${c.value}">
    </div>
  `).join('');
}
document.getElementById('scanConditionsRow').addEventListener('change', e=>{
  const row = e.target.closest('.cond-row');
  if(!row) return;
  const bar = row.dataset.bar;
  const cond = scanConfig.conditions.find(c => c.bar === bar);
  if(!cond) return;
  cond.dir = row.querySelector('.cond-dir').value;
  cond.value = parseFloat(row.querySelector('.cond-value').value) || 0;
  scanArmed = {};
  saveScanConfig();
});

// SMA(14)-of-RSI value conditions — same row shape as the RSI conditions above, but each row
// compares the SMA line itself to a threshold instead of RSI.
function renderSmaConditionRows(){
  const wrap = document.getElementById('scanSmaConditionsRow');
  const sorted = (scanConfig.smaConditions||[]).slice().sort((a,b)=>BAR_ORDER.indexOf(a.bar)-BAR_ORDER.indexOf(b.bar));
  wrap.innerHTML = sorted.map(c => `
    <div class="cond-row" data-bar="${c.bar}">
      <span class="cond-tf">${BAR_LABEL[c.bar]||c.bar}</span>
      <span style="font-family:var(--mono); font-size:13px; color:var(--text-dim);">SMA(14)</span>
      <select class="cond-dir">
        <option value="above" ${c.dir==='above'?'selected':''}>≥</option>
        <option value="below" ${c.dir==='below'?'selected':''}>≤</option>
      </select>
      <input class="cond-value" type="number" step="any" value="${c.value}">
    </div>
  `).join('');
}
document.getElementById('scanSmaConditionsRow').addEventListener('change', e=>{
  const row = e.target.closest('.cond-row');
  if(!row) return;
  const bar = row.dataset.bar;
  const cond = (scanConfig.smaConditions||[]).find(c => c.bar === bar);
  if(!cond) return;
  cond.dir = row.querySelector('.cond-dir').value;
  cond.value = parseFloat(row.querySelector('.cond-value').value) || 0;
  scanArmed = {};
  saveScanConfig();
});
document.getElementById('scanSmaBarGroup').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  if(!scanConfig.smaConditions) scanConfig.smaConditions = [];
  const bar = btn.dataset.bar;
  const idx = scanConfig.smaConditions.findIndex(c => c.bar === bar);
  if(idx >= 0){
    // unlike the RSI TF group, this one can be emptied entirely — that's how the SMA-value scan turns off
    scanConfig.smaConditions.splice(idx, 1);
    btn.classList.remove('active');
  }else{
    const template = scanConfig.smaConditions[scanConfig.smaConditions.length-1] || { dir:'above', value:85 };
    scanConfig.smaConditions.push({ bar, dir: template.dir, value: template.value });
    btn.classList.add('active');
  }
  renderSmaConditionRows();
  scanArmed = {};
  saveScanConfig();
});

function syncScanUI(){
  document.getElementById('scanEnabled').checked = scanConfig.enabled;
  document.querySelectorAll('#scanBarGroup button').forEach(b=>{
    b.classList.toggle('active', scanConfig.conditions.some(c=>c.bar===b.dataset.bar));
  });
  document.querySelectorAll('#scanLogicGroup button').forEach(b=>{
    b.classList.toggle('active', b.dataset.logic === (scanConfig.logic || 'or'));
  });
  renderConditionRows();
  document.querySelectorAll('#scanSmaBarGroup button').forEach(b=>{
    b.classList.toggle('active', (scanConfig.smaConditions||[]).some(c=>c.bar===b.dataset.bar));
  });
  renderSmaConditionRows();
  document.getElementById('scanLimit').value = scanConfig.limit;
  document.getElementById('scanSmaDiffEnabled').checked = !!scanConfig.smaDiffEnabled;
  document.getElementById('scanSmaDiffValue').value = scanConfig.smaDiffValue != null ? scanConfig.smaDiffValue : 7;
  document.getElementById('scanYdayPctEnabled').checked = !!scanConfig.ydayPctEnabled;
  document.getElementById('scanYdayPctValue').value = scanConfig.ydayPctValue != null ? scanConfig.ydayPctValue : 20;
}
async function onScanConfigChange(){
  scanConfig.enabled = document.getElementById('scanEnabled').checked;
  scanConfig.limit = parseInt(document.getElementById('scanLimit').value) || 150;
  scanConfig.smaDiffEnabled = document.getElementById('scanSmaDiffEnabled').checked;
  scanConfig.smaDiffValue = parseFloat(document.getElementById('scanSmaDiffValue').value) || 7;
  scanConfig.ydayPctEnabled = document.getElementById('scanYdayPctEnabled').checked;
  scanConfig.ydayPctValue = parseFloat(document.getElementById('scanYdayPctValue').value) || 20;
  scanArmed = {};
  await saveScanConfig();
}
document.getElementById('scanBarGroup').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const bar = btn.dataset.bar;
  const idx = scanConfig.conditions.findIndex(c => c.bar === bar);
  if(idx >= 0){
    // keep at least one TF selected — can't remove the last remaining condition
    if(scanConfig.conditions.length <= 1) return;
    scanConfig.conditions.splice(idx, 1);
    btn.classList.remove('active');
  }else{
    // new TF: seed with the most recently added condition's dir/value, or a sensible default
    const template = scanConfig.conditions[scanConfig.conditions.length-1] || { dir:'above', value:85 };
    scanConfig.conditions.push({ bar, dir: template.dir, value: template.value });
    btn.classList.add('active');
  }
  renderConditionRows();
  scanArmed = {};
  saveScanConfig();
});
['scanEnabled','scanLimit','scanSmaDiffEnabled','scanSmaDiffValue','scanYdayPctEnabled','scanYdayPctValue'].forEach(id=>{
  document.getElementById(id).addEventListener('change', onScanConfigChange);
});
document.getElementById('scanLogicGroup').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  scanConfig.logic = btn.dataset.logic;
  document.querySelectorAll('#scanLogicGroup button').forEach(b=>b.classList.toggle('active', b===btn));
  scanArmed = {};
  saveScanConfig();
});
document.getElementById('scanNowBtn').addEventListener('click', scanMarket);

window.addEventListener('resize', ()=>{ if(candles.length){ drawChart(); drawRSIChart(); } });

// ---------- init ----------
async function initApp(){
  await loadState();
  document.getElementById('chartSym').textContent = selected;
  renderWatchlist(); syncScanUI(); renderScanResults();
  document.getElementById('clearWatchlistBtn').addEventListener('click', async ()=>{
    if(watchlist.length===0) return;
    if(!confirm(`Clear the entire watchlist (${watchlist.length} coins)? This cannot be undone`)) return;
    watchlist = [];
    dailyChangeData = {};
    await saveWatchlist();
    renderWatchlist();
    toast('Watchlist cleared');
  });
  attachCrosshair();
  await fetchTickers();
  await loadCandles();
  refreshDailyChanges();
  setInterval(fetchTickers, 5000);
  setInterval(async ()=>{ await fetchFuturesTickers(); renderWatchlist(); if(isSwapInst(selected)) renderHero(); }, 15000);
  setInterval(loadCandles, 30000);
  setInterval(refreshDailyChanges, 60000);
  // initial market scan, then keep scanning every 10 min if enabled
  scanMarket();
  setInterval(()=>{ if(scanConfig.enabled) scanMarket(); }, 10*60*1000);
}
</script>
